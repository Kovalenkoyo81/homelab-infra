---
# defaults file for roles/node_exporter
node_exporter_version: "1.8.2"
node_exporter_user: node_exporter
node_exporter_listen_address: "0.0.0.0:9100"

node_exporter_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armv7

node_exporter_arch: "{{ node_exporter_arch_map[ansible_facts['architecture']] }}"
node_exporter_archive: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"
