---
# tasks file for roles/alertmanager

- name: Create alertmanager system user
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create alertmanager directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ alertmanager_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ alertmanager_config_dir }}", owner: root, mode: "0755" }
    - { path: "{{ alertmanager_data_dir }}", owner: "{{ alertmanager_user }}", mode: "0750" }

- name: Ensure alertmanager owns its data directory contents
  ansible.builtin.file:
    path: "{{ alertmanager_data_dir }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_user }}"
    recurse: true

- name: Download alertmanager archive
  ansible.builtin.get_url:
    url: "{{ alertmanager_url }}/{{ alertmanager_archive }}.tar.gz"
    dest: "/tmp/{{ alertmanager_archive }}.tar.gz"
    checksum: "sha256:{{ alertmanager_url }}/sha256sums.txt"
    mode: "0644"

- name: Unpack alertmanager archive
  ansible.builtin.unarchive:
    src: "/tmp/{{ alertmanager_archive }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ alertmanager_archive }}/alertmanager"

- name: Install alermanager binaries
  ansible.builtin.copy:
    src: "/tmp/{{ alertmanager_archive }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - alertmanager
    - amtool
  notify: Restart alertmanager

- name: Install alertmanager config
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: root
    group: "{{ alertmanager_user }}"
    mode: "0640"
    validate: /usr/local/bin/amtool check-config %s
  no_log: true
  notify: Reload alertmanager

- name: Install alertmanager systemd unit
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
    validate: systemd-analyze verify %s
  notify: Restart alertmanager

- name: Ensure alertmanager is enabled and running
  ansible.builtin.systemd_service:
    name: alertmanager
    state: started
    enabled: true
    daemon_reload: true
