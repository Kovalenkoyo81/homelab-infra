---
# tasks file for roles/prometheus

- name: Create prometheus system user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ prometheus_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ prometheus_config_dir }}", owner: root, mode: "0755" }
    - { path: "{{ prometheus_config_dir }}/rules", owner: root, mode: "0755" }
    - { path: "{{ prometheus_data_dir }}", owner: "{{ prometheus_user }}", mode: "0750" }

- name: Ensure prometheus owns its data directory contents
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    recurse: true

- name: Download prometheus archive
  ansible.builtin.get_url:
    url: "{{ prometheus_url }}/{{ prometheus_archive }}.tar.gz"
    dest: "/tmp/{{ prometheus_archive }}.tar.gz"
    checksum: "sha256:{{ prometheus_url }}/sha256sums.txt"
    mode: "0644"

- name: Unpack prometheus archive
  ansible.builtin.unarchive:
    src: "/tmp/{{ prometheus_archive }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ prometheus_archive }}/prometheus"

- name: Install prometheus binaries
  ansible.builtin.copy:
    src: "/tmp/{{ prometheus_archive }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - prometheus
    - promtool
  notify: Restart prometheus

- name: Install prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: "{{ prometheus_user }}"
    mode: "0640"
    validate: /usr/local/bin/promtool check config %s
  notify: Reload prometheus

- name: Install prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
    validate: systemd-analyze verify %s
  notify: Restart prometheus

- name: Ensure prometheus is enabled and running
  ansible.builtin.systemd_service:
    name: prometheus
    state: started
    enabled: true
    daemon_reload: true
